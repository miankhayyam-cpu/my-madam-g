<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e0527a" />
  <title>My Madam G</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>My Madam G</h1>
  </header>

  <div id="onboard-slot"></div>
  <main id="view" class="app-view"></main>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="calendar">
      <span class="tab-icon">📅</span><span>Calendar</span>
    </button>
    <button class="tab-btn" data-tab="insights">
      <span class="tab-icon">📊</span><span>Insights</span>
    </button>
    <button class="tab-btn" data-tab="settings">
      <span class="tab-icon">⚙️</span><span>Settings</span>
    </button>
  </nav>

  <div id="sheet" class="sheet"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>

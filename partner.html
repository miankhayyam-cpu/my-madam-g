<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e0527a" />
  <title>My Madam G Dashboard</title>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>My Madam G Dashboard</h1>
  </header>

  <main id="partner-view" class="app-view"></main>

  <nav class="tab-bar" id="partner-tab-bar" hidden>
    <button class="tab-btn active" data-tab="calendar">
      <span class="tab-icon">📅</span><span>Calendar</span>
    </button>
    <button class="tab-btn" data-tab="insights">
      <span class="tab-icon">📊</span><span>Insights</span>
    </button>
    <button class="tab-btn" data-tab="schedule">
      <span class="tab-icon">🏋️</span><span>Schedule</span>
    </button>
  </nav>

  <div id="partner-sheet" class="sheet"></div>

  <script type="module" src="./js/partner.js"></script>
</body>
</html>
